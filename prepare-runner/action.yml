name: Prepare runner
description: Install packages, set environment variables, create directories

inputs:
  enable_ccache:
    description: Whether ccache should be enabled
    required: true

runs:
  using: composite
  steps:
    - name: Delete old build tools installed using Homebrew (macOS)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        brew uninstall --force \
          cmake \
          conan \
          corrosion \
          rust

    - name: Trust AWS Homebrew tap (macOS)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: brew trust aws/aws

    - name: Install build tools using Homebrew (macOS)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        brew install --quiet \
          ca-certificates \
          ccache \
          clang-build-analyzer \
          colima \
          coreutils \
          docker \
          ninja \
          python@3.14

    - name: Cleanup Homebrew (macOS)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: brew cleanup --prune=all --scrub

    - name: List software installed using Homebrew (macOS)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: brew list --version

    - name: Install build tools using pip (macOS)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        python3.14 -m pip install --break-system-packages \
          "certifi>=2026.10.19" \
          cmake==4.3.4 \
          conan==2.29.1

    # The system curl, git and python3 verify against /etc/ssl/cert.pem, which
    # macOS doesn't update, so it still trusts the compromised eMudhra roots
    # (see https://emudhra.we-have-a-problem.com/). Homebrew ships the current
    # Mozilla list; not its etc/ bundle, which also pulls in keychain roots.
    - name: Update system CA bundle from Homebrew (macOS)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        BUNDLE="$(brew --prefix ca-certificates)/share/ca-certificates/cacert.pem"
        if cmp -s "${BUNDLE}" /etc/ssl/cert.pem; then
          echo "/etc/ssl/cert.pem is already up to date"
        elif sudo -n install -m 644 -o root -g wheel "${BUNDLE}" /etc/ssl/cert.pem; then
          echo "Replaced /etc/ssl/cert.pem with ${BUNDLE}"
        else
          echo "::warning::Passwordless sudo is unavailable, so /etc/ssl/cert.pem may still trust the compromised eMudhra roots"
        fi

    - name: Export Rust variables (macOS)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Install rustup (macOS)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        if [ -x "$HOME/.cargo/bin/rustup" ] || command -v rustup >/dev/null 2>&1; then
          echo "rustup already installed; skipping installation"
        else
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
            --default-toolchain stable \
            --profile minimal
        fi

    - name: Install cargo-binstall (macOS)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        CARGO_BIN="$HOME/.cargo/bin"
        export PATH="$CARGO_BIN:$PATH"

        if [ -x "$CARGO_BIN/cargo-binstall" ] || command -v cargo-binstall >/dev/null 2>&1; then
          echo "cargo-binstall already installed; skipping installation"
        else
          curl --proto '=https' --tlsv1.2 -sSf -L \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
        fi

    - name: Set up Python (Windows)
      if: ${{ runner.os == 'Windows' }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.13
    - name: Install build tools using pip (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: bash
      run: |
        pip install \
          conan==2.24.0

    - name: Install build tools using chocolatey (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: bash
      run: |
        # Note: Using version 4.12.x causes Windows Debug builds to fail.
        choco install -y ccache --version 4.11.3 --allow-downgrade

    - name: Export Rust variables (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: bash
      run: |
        echo "CARGO_HOME=Z:\cargo" >> $GITHUB_ENV
        echo "RUSTUP_HOME=Z:\rustup" >> $GITHUB_ENV
        echo "Z:\cargo\bin" >> $GITHUB_PATH

    - name: Install Rust (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: bash
      run: |
        # Download rustup-init.exe directly (the sh.rustup.rs wrapper auto-detects
        # --default-host as gnu in bash, causing a duplicate-flag error if we override it)
        curl --proto '=https' --tlsv1.2 -sSf -o rustup-init.exe https://win.rustup.rs/x86_64
        ./rustup-init.exe -y --default-toolchain=1.91.1 --default-host=x86_64-pc-windows-msvc
        rm -f rustup-init.exe

    - name: Install cargo tools (macOS and Windows)
      if: ${{ runner.os == 'macOS' || runner.os == 'Windows' }}
      shell: bash
      run: |
        # Note: cargo-binstall cannot be bootstrapped on Windows, as its
        # installer is a PowerShell script that antivirus software flags as
        # malicious. Build from source there instead, which is slow but only
        # has to happen once per runner.
        for TOOL in cargo-audit cargo-llvm-cov cargo-nextest; do
          if command -v "$TOOL" >/dev/null 2>&1; then
            echo "$TOOL already installed; skipping installation"
            continue
          fi

          # Note: The binary is missing here, but cargo's install metadata may
          # still claim otherwise on a runner after old `Swatinem/rust-cache` removed `~/.cargo/bin`
          # Running with `--force` to force installation.
          # See https://github.com/XRPLF/rippled/pull/8062 for more details
          if command -v cargo-binstall >/dev/null 2>&1; then
            cargo binstall --no-confirm --force "$TOOL"
          else
            cargo install --locked --force "$TOOL"
          fi

          if ! command -v "$TOOL" >/dev/null 2>&1; then
            echo "::error::$TOOL is still missing after installation"
            exit 1
          fi
        done

    - name: Install Rust toolchain (macOS and Windows)
      if: ${{ runner.os == 'macOS' || runner.os == 'Windows' }}
      shell: bash
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup component add clippy rustfmt

    - name: Fix git permissions
      shell: bash
      run: git config --global --add safe.directory "$PWD"

    # RUNNER_TEMP is emptied by the runner at the start and end of every job, so
    # the caches are never shared between runs. It is also writable both as root
    # in a container and as a non-root runner user, and it is outside
    # GITHUB_WORKSPACE, which tools walking the source tree scan (e.g. gcovr).
    - name: Set env variables
      shell: bash
      run: |
        # Windows accepts forward slashes too, so normalizing the separator
        # keeps this identical on every platform.
        CACHE_ROOT="${RUNNER_TEMP//\\//}"
        echo "CCACHE_DIR=${CACHE_ROOT}/.ccache" >> "${GITHUB_ENV}"
        echo "CONAN_HOME=${CACHE_ROOT}/.conan2" >> "${GITHUB_ENV}"

    - name: Set CCACHE_DISABLE=1
      if: ${{ inputs.enable_ccache == 'false' }}
      shell: bash
      run: |
        echo "CCACHE_DISABLE=1" >> $GITHUB_ENV

    - name: Create directories
      shell: bash
      run: |
        mkdir -p "$CCACHE_DIR"
        mkdir -p "$CONAN_HOME"
