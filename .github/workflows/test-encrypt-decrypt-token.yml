on:
  pull_request:
    paths:
      - ".github/workflows/test-encrypt-decrypt-token.yml"
      - "encrypt-token/**"
      - "decrypt-token/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-encrypt-decrypt-token.yml"
      - "encrypt-token/**"
      - "decrypt-token/**"
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

defaults:
  run:
    shell: bash

env:
  GPG_PASSPHRASE: test-passphrase
  TEST_TOKEN: test-token-value

jobs:
  test-encrypt-decrypt-token:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run encrypt-token
        id: encrypt
        uses: ./encrypt-token
        with:
          token: ${{ env.TEST_TOKEN }}
          gpg_passphrase: ${{ env.GPG_PASSPHRASE }}

      - name: Confirm an encrypted token was returned
        env:
          ENC_TOKEN: ${{ steps.encrypt.outputs.token }}
        run: test -n "${ENC_TOKEN}"

      - name: Confirm the token was not returned unchanged
        env:
          ENC_TOKEN: ${{ steps.encrypt.outputs.token }}
        run: test "${ENC_TOKEN}" != "${TEST_TOKEN}"

      - name: Confirm the encrypted token is valid base64
        env:
          ENC_TOKEN: ${{ steps.encrypt.outputs.token }}
        run: echo -n "${ENC_TOKEN}" | base64 -d >/dev/null

      - name: Run decrypt-token with a GPG-encrypted token
        id: decrypt-encrypted
        uses: ./decrypt-token
        with:
          token: ${{ steps.encrypt.outputs.token }}
          gpg_passphrase: ${{ env.GPG_PASSPHRASE }}

      - name: Run decrypt-token with a plain (unencrypted) token
        id: decrypt-plain
        uses: ./decrypt-token
        with:
          token: ${{ env.TEST_TOKEN }}

      - name: Confirm the decrypted token matches the original
        env:
          DECRYPTED: ${{ steps.decrypt-encrypted.outputs.token }}
        run: test "${DECRYPTED}" = "${TEST_TOKEN}"

      - name: Confirm a plain token is passed through unchanged
        env:
          PLAIN: ${{ steps.decrypt-plain.outputs.token }}
        run: test "${PLAIN}" = "${TEST_TOKEN}"
