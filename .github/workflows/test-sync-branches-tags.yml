name: Test synchronizing branches and tags between two repositories

on:
  pull_request:
    paths:
      - ".github/scripts/sync-*"
      - ".github/workflows/sync-branches-tags.yml"
      - ".github/workflows/test-sync-branches-tags.yml"
      - "clone-repo/**"
      - "configure-git/**"
      - "configure-github-app/**"
  push:
    branches: [main]
    paths:
      - ".github/scripts/sync-*"
      - ".github/workflows/sync-branches-tags.yml"
      - ".github/workflows/test-sync-branches-tags.yml"
      - "clone-repo/**"
      - "configure-git/**"
      - "configure-github-app/**"
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

# Limit a single instance of this workflow to run at a time by gating on a single named concurrency
# group, to prevent multiple instances from trying to update the same branches and tags at the same
# time. An ongoing execution is not canceled.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The source and destination repositories to use.
  REPO_SRC: actions-sync-test-src
  REPO_DST: actions-sync-test-dst
  # The branch and tag names to use.
  BRANCH: test-${{ github.run_id }}-${{ github.run_attempt }}
  TAG: v${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  # Verify the GitHub App secrets are configured and the app can actually access the source and
  # destination test repos, before running anything else. Minting a token scoped to those repos
  # doubles as an existence/access check for them, so no separate lookup is needed.
  check-prerequisites:
    name: Check prerequisites
    runs-on: ubuntu-latest
    outputs:
      can_run: ${{ steps.check.outputs.can_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Secrets cannot be referenced directly in a step's `if:`, so check their presence here and
      # gate the next step on this step's output instead.
      - name: Check if GitHub App secrets are available
        id: has-secrets
        env:
          HAS_SECRETS: ${{ secrets.XRPLF_GITHUB_APP_CLIENT_ID != '' && secrets.XRPLF_GITHUB_APP_PRIVATE_KEY != '' }}
        run: echo "has_secrets=${HAS_SECRETS}" >> "${GITHUB_OUTPUT}"

      - name: Configure GitHub App
        id: configure-app
        if: ${{ steps.has-secrets.outputs.has_secrets == 'true' }}
        continue-on-error: true
        uses: ./configure-github-app
        with:
          client_id: ${{ secrets.XRPLF_GITHUB_APP_CLIENT_ID }}
          private_key: ${{ secrets.XRPLF_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ env.REPO_SRC }},${{ env.REPO_DST }}

      - name: Report whether the test environment is available
        id: check
        env:
          OUTCOME: ${{ steps.configure-app.outcome }}
        run: echo "can_run=$([[ "${OUTCOME}" == 'success' ]] && echo true || echo false)" >> "${GITHUB_OUTPUT}"

  # Create the test branch and tag in the source repository. Every job mints its own GitHub App
  # token, scoped to the test repositories and revoked when the job ends, so no token is passed
  # between jobs.
  create-branch-tag:
    name: Create branch and tag
    if: ${{ needs.check-prerequisites.outputs.can_run == 'true' }}
    needs: check-prerequisites
    runs-on: ubuntu-latest
    outputs:
      # The env context is not available in a job's `with:` when calling a reusable workflow, so
      # expose these as job outputs for the sync-* jobs below to consume via `needs`. (Note that, in
      # contrast, the env context is available in a step's `with:` when calling a local action.)
      repo_src: ${{ env.REPO_SRC }}
      repo_dst: ${{ env.REPO_DST }}
      branch: ${{ env.BRANCH }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure GitHub App
        id: configure-app
        uses: ./configure-github-app
        with:
          client_id: ${{ secrets.XRPLF_GITHUB_APP_CLIENT_ID }}
          private_key: ${{ secrets.XRPLF_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ env.REPO_SRC }},${{ env.REPO_DST }}

      - name: Configure git
        uses: ./configure-git
        with:
          user_name: ${{ steps.configure-app.outputs.user_name }}
          user_email: ${{ steps.configure-app.outputs.user_email }}

      - name: Clone the source repo
        uses: ./clone-repo
        with:
          repository: ${{ github.repository_owner }}/${{ env.REPO_SRC }}
          token: ${{ steps.configure-app.outputs.app_token }}

      - name: Create a test branch and tag in the source repo
        working-directory: ${{ env.REPO_SRC }}
        run: |
          git checkout -b ${BRANCH}
          git commit --allow-empty -m "Test commit"
          git push --set-upstream origin ${BRANCH}
          git tag ${TAG}
          git push origin tag ${TAG}

  # Do a sync dry-run to ensure the workflow and scripts are working.
  sync-dry-run:
    name: Sync branches and tags (dry-run)
    if: ${{ needs.check-prerequisites.outputs.can_run == 'true' }}
    needs:
      - check-prerequisites
      - create-branch-tag
    uses: ./.github/workflows/sync-branches-tags.yml
    secrets:
      app_client_id: ${{ secrets.XRPLF_GITHUB_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.XRPLF_GITHUB_APP_PRIVATE_KEY }}
    with:
      source: ${{ github.repository_owner }}/${{ needs.create-branch-tag.outputs.repo_src }}
      destination: ${{ github.repository_owner }}/${{ needs.create-branch-tag.outputs.repo_dst }}
      branch_globs: ${{ needs.create-branch-tag.outputs.branch }}
      dry_run: true

  # Verify that the test branch and tag do not exist in the destination repo.
  verify-dry-run:
    name: Verify (dry-run)
    if: ${{ needs.check-prerequisites.outputs.can_run == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - check-prerequisites
      - create-branch-tag
      - sync-dry-run
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure GitHub App
        id: configure-app
        uses: ./configure-github-app
        with:
          client_id: ${{ secrets.XRPLF_GITHUB_APP_CLIENT_ID }}
          private_key: ${{ secrets.XRPLF_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ env.REPO_DST }}

      - name: Clone the destination repo
        uses: ./clone-repo
        with:
          repository: ${{ github.repository_owner }}/${{ env.REPO_DST }}
          token: ${{ steps.configure-app.outputs.app_token }}

      # A plain clone only checks out the default branch under refs/heads; every other branch
      # (including this test branch) is only present as a remote-tracking ref.
      - name: Confirm the test branch was not created by the dry run
        working-directory: ${{ env.REPO_DST }}
        run: '! git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"'

      - name: Confirm the test tag was not created by the dry run
        working-directory: ${{ env.REPO_DST }}
        run: '! git show-ref --verify --quiet "refs/tags/${TAG}"'

  # Do a regular (non-dry-run) sync, which will create the test branch and tag in the destination
  # repository.
  sync-regular:
    name: Sync branches and tags (regular)
    if: ${{ needs.check-prerequisites.outputs.can_run == 'true' }}
    uses: ./.github/workflows/sync-branches-tags.yml
    needs:
      - check-prerequisites
      - create-branch-tag
      - verify-dry-run
    secrets:
      app_client_id: ${{ secrets.XRPLF_GITHUB_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.XRPLF_GITHUB_APP_PRIVATE_KEY }}
    with:
      source: ${{ github.repository_owner }}/${{ needs.create-branch-tag.outputs.repo_src }}
      destination: ${{ github.repository_owner }}/${{ needs.create-branch-tag.outputs.repo_dst }}
      branch_globs: ${{ needs.create-branch-tag.outputs.branch }}
      dry_run: false

  # Verify that the test branch and tag now exist in the destination repository.
  verify-regular:
    name: Verify (regular)
    if: ${{ needs.check-prerequisites.outputs.can_run == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - check-prerequisites
      - create-branch-tag
      - sync-regular
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure GitHub App
        id: configure-app
        uses: ./configure-github-app
        with:
          client_id: ${{ secrets.XRPLF_GITHUB_APP_CLIENT_ID }}
          private_key: ${{ secrets.XRPLF_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ env.REPO_DST }}

      - name: Clone the destination repo
        uses: ./clone-repo
        with:
          repository: ${{ github.repository_owner }}/${{ env.REPO_DST }}
          token: ${{ steps.configure-app.outputs.app_token }}

      - name: Confirm the test branch was synchronized to the destination
        working-directory: ${{ env.REPO_DST }}
        run: git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"

      - name: Confirm the test tag was synchronized to the destination
        working-directory: ${{ env.REPO_DST }}
        run: git show-ref --verify --quiet "refs/tags/${TAG}"

  # Clean up the test branch and tag from both repositories. Run the cleanup job even if previous
  # jobs failed, and also run its steps unconditionally, so they run if previous steps failed.
  clean-up:
    name: Clean up
    if: ${{ always() && needs.check-prerequisites.outputs.can_run == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - check-prerequisites
      - create-branch-tag
      - verify-regular
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure GitHub App
        id: configure-app
        uses: ./configure-github-app
        with:
          client_id: ${{ secrets.XRPLF_GITHUB_APP_CLIENT_ID }}
          private_key: ${{ secrets.XRPLF_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ env.REPO_SRC }},${{ env.REPO_DST }}

      - name: Clone the source repo
        if: always()
        uses: ./clone-repo
        with:
          repository: ${{ github.repository_owner }}/${{ env.REPO_SRC }}
          token: ${{ steps.configure-app.outputs.app_token }}

      - name: Remove branch and tag from the source repository
        if: always()
        working-directory: ${{ env.REPO_SRC }}
        run: |
          git push origin --delete ${BRANCH}
          git push origin --delete tag ${TAG}

      - name: Clone the destination repo
        if: always()
        uses: ./clone-repo
        with:
          repository: ${{ github.repository_owner }}/${{ env.REPO_DST }}
          token: ${{ steps.configure-app.outputs.app_token }}

      - name: Remove branch and tag from the destination repository
        if: always()
        working-directory: ${{ env.REPO_DST }}
        run: |
          git push origin --delete ${BRANCH}
          git push origin --delete tag ${TAG}
