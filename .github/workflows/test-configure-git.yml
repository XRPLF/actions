on:
  pull_request:
    paths:
      - ".github/workflows/test-configure-git.yml"
      - "configure-git/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-configure-git.yml"
      - "configure-git/**"
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

defaults:
  run:
    shell: bash

jobs:
  test-configure-git:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run configure-git
        uses: ./configure-git
        with:
          user_name: Test User
          user_email: test-user@example.com

      - name: Confirm git user.name was configured
        env:
          USER_NAME: Test User
        run: test "$(git config --global user.name)" = "${USER_NAME}"

      - name: Confirm git user.email was configured
        env:
          USER_EMAIL: test-user@example.com
        run: test "$(git config --global user.email)" = "${USER_EMAIL}"
