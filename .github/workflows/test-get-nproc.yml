on:
  pull_request:
    paths:
      - ".github/workflows/test-get-nproc.yml"
      - "get-nproc/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-get-nproc.yml"
      - "get-nproc/**"
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

defaults:
  run:
    shell: bash

env:
  SUBTRACTION: 2

jobs:
  test-get-nproc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: heavy
            container: '{ "image": "ghcr.io/xrplf/xrpld/nix-ubuntu:latest" }'
          - os: heavy-arm64
            container: '{ "image": "ghcr.io/xrplf/xrpld/nix-ubuntu:latest" }'
          - os: macos15
          - os: dev-box-windows-2026

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container != '' && fromJson(matrix.container) || null }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run get-nproc action without subtraction
        id: without-subtraction
        uses: ./get-nproc

      - name: Run get-nproc action with small subtraction
        id: with-small-subtraction
        uses: ./get-nproc
        with:
          subtract: ${{ env.SUBTRACTION }}

      - name: Run get-nproc action with large subtraction (should fail)
        id: with-large-subtraction
        uses: ./get-nproc
        with:
          subtract: "1000"
        continue-on-error: true

      - name: Display results
        env:
          WITHOUT_SUB: ${{ steps.without-subtraction.outputs.nproc }}
          WITH_SUB: ${{ steps.with-small-subtraction.outputs.nproc }}
        run: |
          echo "NPROC without subtraction: ${WITHOUT_SUB}"
          echo "NPROC with small subtraction: ${WITH_SUB}"

      - name: Confirm at least 1 processor is reported without subtraction
        env:
          WITHOUT_SUB: ${{ steps.without-subtraction.outputs.nproc }}
        run: test "${WITHOUT_SUB}" -ge 1

      - name: Confirm at least 1 processor is reported after subtraction
        env:
          WITH_SUB: ${{ steps.with-small-subtraction.outputs.nproc }}
        run: test "${WITH_SUB}" -ge 1

      - name: Confirm the subtraction was applied to the processor count
        env:
          WITHOUT_SUB: ${{ steps.without-subtraction.outputs.nproc }}
          WITH_SUB: ${{ steps.with-small-subtraction.outputs.nproc }}
        run: test "$((WITHOUT_SUB - SUBTRACTION))" -eq "${WITH_SUB}"

      - name: Confirm a subtraction larger than the processor count fails
        env:
          OUTCOME: ${{ steps.with-large-subtraction.outcome }}
        run: test "${OUTCOME}" = "failure"
