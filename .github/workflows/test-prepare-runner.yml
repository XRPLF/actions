on:
  pull_request:
    paths:
      - ".github/workflows/test-prepare-runner.yml"
      - "prepare-runner/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-prepare-runner.yml"
      - "prepare-runner/**"
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  test-prepare-runner:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: heavy
            container: '{ "image": "ghcr.io/xrplf/xrpld/nix-ubuntu:latest" }'
          - os: heavy-arm64
            container: '{ "image": "ghcr.io/xrplf/xrpld/nix-ubuntu:latest" }'
          - os: ubuntu-latest
          - os: macos-26-apple-clang-21
          - os: dev-box-windows-2026

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container != '' && fromJson(matrix.container) || null }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run prepare-runner action
        uses: ./prepare-runner
        with:
          enable_ccache: false

      - name: Verify ccache is disabled
        shell: bash
        run: |
          if [ "$CCACHE_DISABLE" != "1" ]; then
              echo "CCACHE_DISABLE is not set to 1"
              exit 1
          fi
          echo "CCACHE_DISABLE is correctly set to 1"

      - name: Verify ccache and conan directories are writable
        shell: bash
        run: |
          for DIR in "${CCACHE_DIR}" "${CONAN_HOME}"; do
            if [ ! -d "${DIR}" ] || [ ! -w "${DIR}" ]; then
                echo "${DIR} does not exist or is not writable"
                exit 1
            fi
          done
          echo "CCACHE_DIR and CONAN_HOME exist and are writable"

      - name: Verify ccache and conan directories are in the runner temp dir
        shell: bash
        run: |
          # Windows uses the other path separator, so compare with the
          # separators normalized.
          norm() { printf '%s' "$1" | tr '\\' '/'; }

          CHECKOUT="$(norm "${GITHUB_WORKSPACE}")"

          STATUS=0
          for PAIR in "CCACHE_DIR:.ccache" "CONAN_HOME:.conan2"; do
            VAR="${PAIR%%:*}"
            ACTUAL="$(norm "${!VAR}")"
            EXPECTED="$(norm "${RUNNER_TEMP}/${PAIR#*:}")"
            if [ "${ACTUAL}" != "${EXPECTED}" ]; then
                echo "${VAR} is '${ACTUAL}', expected '${EXPECTED}'"
                STATUS=1
            fi
            # The checkout is walked by tools such as gcovr, so the caches
            # must stay outside of it.
            case "${ACTUAL}/" in
              "${CHECKOUT}"/*)
                echo "${VAR} is '${ACTUAL}', which is inside the checkout '${CHECKOUT}'"
                STATUS=1
                ;;
            esac
          done
          [ "${STATUS}" -eq 0 ] || exit 1
          echo "CCACHE_DIR and CONAN_HOME are in the runner temp dir, outside the checkout"

      # ubuntu-latest is only present to exercise prepare-runner on a bare
      # Linux runner (no container); it does not have cmake/conan/ccache/Rust
      # preinstalled the way the other runners do.
      - name: Verify build tools are able to run
        if: ${{ matrix.os != 'ubuntu-latest' }}
        shell: bash
        run: |
          cmake --version
          conan --version
          ccache --version

          if [[ "${{ matrix.os }}" == "macos-26-apple-clang-21" ]]; then
              colima --version
              docker --version
          fi

      # TODO: temporary, to find out why some macOS runners still trust the
      # compromised eMudhra chain after /etc/ssl/cert.pem is replaced.
      - name: Debug TLS trust (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          HOST=dv-g3b-emudhra.we-have-a-problem.com
          set -x
          sw_vers
          ls -la /etc/ssl/cert.pem ~/.curlrc /private/var/protected/trustd/ || true
          cat ~/.curlrc || true
          env | grep -iE "curl|ssl|cert|requests" || true
          /usr/bin/curl -V
          /usr/bin/curl -v -o /dev/null "https://${HOST}/" 2>&1 | grep '^\*' || true

          # Keychain view of the chain: with and without network revocation checks.
          echo | /usr/bin/openssl s_client -connect "${HOST}:443" -servername "${HOST}" -showcerts 2>/dev/null |
            awk -v dir="${RUNNER_TEMP}" '/BEGIN CERT/ { n++; p = 1 } p { print > (dir "/chain" n ".pem") } /END CERT/ { p = 0 }' || true
          CHAIN=()
          for f in "${RUNNER_TEMP}"/chain*.pem; do CHAIN+=(-c "$f"); done
          security verify-cert "${CHAIN[@]}" -p ssl -s "${HOST}" || true
          security verify-cert "${CHAIN[@]}" -p ssl -s "${HOST}" -L -R offline || true

          # Whether the roots are system roots, and any admin/user trust overrides.
          security find-certificate -c "emSign ECC Root CA - G3" -Z /System/Library/Keychains/SystemRootCertificates.keychain | grep SHA-256 || true
          security dump-trust-settings -d || true
          security dump-trust-settings || true

      # Both eMudhra checks expect a certificate verification failure
      # specifically, so an unreachable host doesn't pass as distrusted.
      - name: Verify the system curl distrusts compromised eMudhra roots (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          STATUS=0
          for HOST in dv-g3b-emudhra.we-have-a-problem.com dv-g3b-aaa-emudhra.we-have-a-problem.com; do
            RC=0
            /usr/bin/curl -sS -o /dev/null "https://${HOST}/" || RC=$?
            if [ "${RC}" -ne 60 ]; then
                echo "/usr/bin/curl to ${HOST} exited with ${RC}, expected 60"
                STATUS=1
            fi
          done
          [ "${STATUS}" -eq 0 ] || exit 1
          echo "The system curl distrusts the compromised roots"

      - name: Verify certifi distrusts compromised eMudhra roots (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          STATUS=0
          for HOST in dv-g3b-emudhra.we-have-a-problem.com dv-g3b-aaa-emudhra.we-have-a-problem.com; do
            OUT="$(python3.14 -I -c 'import requests, sys; requests.get(sys.argv[1])' "https://${HOST}/" 2>&1 || true)"
            if ! grep -q CERTIFICATE_VERIFY_FAILED <<<"${OUT}"; then
                echo "requests (certifi) to ${HOST} did not fail certificate verification"
                STATUS=1
            fi
          done
          [ "${STATUS}" -eq 0 ] || exit 1
          echo "certifi distrusts the compromised roots"

      - name: Verify Rust tools are able to run
        if: ${{ matrix.os != 'ubuntu-latest' }}
        shell: bash
        run: |
          cargo --version
          rustc --version

          cargo audit --version
          cargo clippy --version
          cargo fmt --version
          cargo llvm-cov --version
          cargo nextest --version
