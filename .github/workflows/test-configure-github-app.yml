on:
  pull_request:
    paths:
      - ".github/workflows/test-configure-github-app.yml"
      - "configure-github-app/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-configure-github-app.yml"
      - "configure-github-app/**"
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

defaults:
  run:
    shell: bash

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - name: Check if GitHub App secrets are available
        id: check
        env:
          HAS_SECRETS: ${{ secrets.XRPLF_GITHUB_APP_CLIENT_ID != '' && secrets.XRPLF_GITHUB_APP_PRIVATE_KEY != '' }}
        run: echo "has_secrets=${HAS_SECRETS}" >> "${GITHUB_OUTPUT}"

  test-configure-github-app:
    needs: check-secrets
    if: ${{ needs.check-secrets.outputs.has_secrets == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xrplf/xrpld/nix-ubuntu:latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run configure-github-app
        id: app
        uses: ./configure-github-app
        with:
          client_id: ${{ secrets.XRPLF_GITHUB_APP_CLIENT_ID }}
          private_key: ${{ secrets.XRPLF_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      # The outputs are passed via env rather than interpolated into the script, so that the token is
      # never substituted into the script body and values are not re-parsed by the shell.
      - name: Confirm an app token was returned
        env:
          APP_TOKEN: ${{ steps.app.outputs.app_token }}
        run: test -n "${APP_TOKEN}"

      - name: Confirm the app user_name is exposed
        env:
          ACTUAL: ${{ steps.app.outputs.user_name }}
          EXPECTED: xrplf-github-bot[bot]
        run: test "${ACTUAL}" = "${EXPECTED}"

      - name: Confirm the app user_email is exposed
        env:
          ACTUAL: ${{ steps.app.outputs.user_email }}
          EXPECTED: 217668010+xrplf-github-bot[bot]@users.noreply.github.com
        run: test "${ACTUAL}" = "${EXPECTED}"
