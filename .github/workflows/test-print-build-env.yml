on:
  pull_request:
    paths:
      - ".github/workflows/test-print-build-env.yml"
      - "print-build-env/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-print-build-env.yml"
      - "print-build-env/**"
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  test-print-build-env:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: heavy
            container: '{ "image": "ghcr.io/xrplf/xrpld/nix-ubuntu:latest" }'
          - os: heavy-arm64
            container: '{ "image": "ghcr.io/xrplf/xrpld/nix-ubuntu:latest" }'
          - os: macos-26-apple-clang-21
          - os: dev-box-windows-2026

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container != '' && fromJson(matrix.container) || null }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare runner
        uses: ./prepare-runner
        with:
          enable_ccache: false

      - name: Run print-build-env action
        uses: ./print-build-env
