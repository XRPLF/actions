name: Release info
description: Derive the release channel and package release number for this build

outputs:
  channel:
    description: The release channel this build belongs to
    value: ${{ steps.channel.outputs.channel }}
  pkg_release:
    description: "The package release number: 1 for a tag, <run number>.<commit date>git<commit hash> otherwise"
    value: ${{ steps.pkg_release.outputs.pkg_release }}

runs:
  using: composite
  steps:
    # Only a tag says how mature a build is; anything else is a develop build.
    # A tag matching none of the release patterns is a custom build.
    - name: Determine release channel
      id: channel
      shell: bash
      env:
        IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        REF_NAME: ${{ github.ref_name }}
        VISIBILITY: ${{ github.event.repository.visibility }}
      run: |
        release='[0-9]+\.[0-9]+\.[0-9]+'

        if [[ "${VISIBILITY}" != "public" ]]; then
            channel=private
        elif [[ "${IS_TAG}" != "true" ]]; then
            channel=develop
        elif [[ "${REF_NAME}" =~ ^${release}$ ]]; then
            channel=stable
        elif [[ "${REF_NAME}" =~ ^${release}-rc[0-9]+(\+.*)?$ ]]; then
            channel=rc
        elif [[ "${REF_NAME}" =~ ^${release}-b(0|[1-9][0-9]*)(\+.*)?$ ]]; then
            channel=beta
        else
            channel=custom
        fi

        echo "channel=${channel}" | tee -a "${GITHUB_OUTPUT}"

    # A tag's version is unique, so release 1 is enough. Anything else repeats
    # its version, so the release orders the builds with the run number and
    # names the packaged commit with its date and hash.
    - name: Determine package release
      id: pkg_release
      shell: bash
      env:
        IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        if [[ "${IS_TAG}" == "true" ]]; then
            pkg_release=1
        else
            read -r date sha < <(git log -1 --format='%cs %H')
            pkg_release="${RUN_NUMBER}.${date//-/}git${sha:0:7}"
        fi

        echo "pkg_release=${pkg_release}" | tee -a "${GITHUB_OUTPUT}"
