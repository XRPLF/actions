name: Decrypt token
description: Base64-decodes and GPG-decrypts a token if a GPG passphrase is provided, otherwise passes the token through unchanged

inputs:
  token:
    description: The base64-encoded, optionally GPG-encrypted token
    required: true
  gpg_passphrase:
    description: The GPG passphrase the token was encrypted with (if not provided, the token is passed through unchanged)
    required: false

outputs:
  token:
    description: The decrypted (or passed-through) token
    value: ${{ steps.decrypt.outputs.token }}

runs:
  using: composite
  steps:
    - name: Decrypt token
      id: decrypt
      shell: bash
      env:
        ENC_TOKEN: ${{ inputs.token }}
        GPG_PASSPHRASE: ${{ inputs.gpg_passphrase }}
      run: |
        if [ -n "${GPG_PASSPHRASE}" ]; then
          TOKEN=$(echo -n "${ENC_TOKEN}" | base64 -d | gpg --decrypt --batch --passphrase "${GPG_PASSPHRASE}")
        else
          TOKEN="${ENC_TOKEN}"
        fi
        echo "::add-mask::${TOKEN}"
        echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"
