name: Configure GitHub App
description: Create a token for a GitHub App and expose its git user identity

inputs:
  client_id:
    description: The client identifier of the GitHub App
    required: true
  private_key:
    description: The private key of the GitHub App
    required: true
  repositories:
    description: One or more comma-separated repositories to create the token for, as bare names without the owner prefix
    required: true
  owner:
    description: The owner of the repositories, which must be the account the GitHub App is installed on (defaults to the owner of the current repository)
    required: false
    default: ${{ github.repository_owner }}
  skip_token_revoke:
    description: If true, the token will not be revoked when the current job completes (set this when the token is passed to and used by other jobs)
    required: false
    default: "false"
  wait_token_attempt_check:
    description: If true, wait until the token can access the specified repositories before proceeding by periodically checking
    required: false
    default: "true"
  wait_token_attempt_secs:
    description: The number of seconds to wait between attempts to verify the token can access the specified repositories
    required: false
    default: "5"
  wait_token_attempt_num:
    description: The maximum number of attempts to verify the token can access the specified repositories before failing
    required: false
    default: "6"

outputs:
  app_token:
    description: The token for the GitHub App
    value: ${{ steps.app-token.outputs.token }}
  user_name:
    description: The name of the GitHub App, for use with the `configure-git` action
    value: ${{ steps.git-user.outputs.user_name }}
  user_email:
    description: The email address of the GitHub App, for use with the `configure-git` action
    value: ${{ steps.git-user.outputs.user_email }}

runs:
  using: composite
  steps:
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.private_key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
        skip-token-revoke: ${{ inputs.skip_token_revoke }}

    - name: Wait for the token to become active
      # GitHub sometimes issues a token before it has fully propagated, causing requests that
      # immediately use it to sometimes fail to accesse specified repositories. Poll until the
      # token can access all of them before proceeding.
      if: ${{ inputs.wait_token_attempt_check == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        OWNER: ${{ inputs.owner }}
        REPOSITORIES: ${{ inputs.repositories }}
        ATTEMPT_SECS: ${{ inputs.wait_token_attempt_secs }}
        ATTEMPT_NUM: ${{ inputs.wait_token_attempt_num }}
      run: |
        IFS=',' read -ra REPOS <<< "${REPOSITORIES}"
        for ((ATTEMPT = 1; ATTEMPT <= ATTEMPT_NUM; ATTEMPT++)); do
          ACCESSIBLE=true
          for REPO in "${REPOS[@]}"; do
            if ! gh api "repos/${OWNER}/${REPO}" --silent; then
              ACCESSIBLE=false
              break
            fi
          done
          if [ "${ACCESSIBLE}" = true ]; then
            exit 0
          fi
          if [ "${ATTEMPT}" -lt "${ATTEMPT_NUM}" ]; then
            echo "Attempt ${ATTEMPT}/${ATTEMPT_NUM}: token cannot yet access all repositories, waiting ${ATTEMPT_SECS}s..."
            sleep "${ATTEMPT_SECS}"
          fi
        done
        echo "::error::Token could not access all repositories (${REPOSITORIES}) after ${ATTEMPT_NUM} attempts."
        exit 1

    - name: Get GitHub App User ID
      id: app-user
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        USER_ID=$(gh api '/users/${{ steps.app-token.outputs.app-slug }}[bot]' --jq .id)
        echo "user_id=${USER_ID}" >> "${GITHUB_OUTPUT}"

    - name: Determine git user identity
      id: git-user
      shell: bash
      run: |
        USER_NAME='${{ steps.app-token.outputs.app-slug }}[bot]'
        echo "user_name=${USER_NAME}" >> "${GITHUB_OUTPUT}"
        USER_EMAIL='${{ steps.app-user.outputs.user_id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
        echo "user_email=${USER_EMAIL}" >> "${GITHUB_OUTPUT}"
